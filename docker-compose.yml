services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
      SENTINEL_DATA: /data/synthetic_security_events.csv
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTINEL_AI_ANALYST: ${SENTINEL_AI_ANALYST:-auto}
      LIVE_TRAFFIC: ${LIVE_TRAFFIC:-true}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-8}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
