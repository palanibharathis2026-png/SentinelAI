server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Single-page app: let React Router handle every other path.
    location / {
        try_files $uri /index.html;
    }
}
